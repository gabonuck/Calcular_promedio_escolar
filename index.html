<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Promedio</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  input[type="number"] {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px;
    box-sizing: border-box;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
  }

  @media (max-width: 600px) {
    h1 {
      font-size: 24px;
    }
    button {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <h1>Calculadora de Promedio</h1>

  <label for="cantidad">¿Cuántas calificaciones quieres ingresar?</label>
  <input type="number" id="cantidad" min="1">
  <button onclick="generarCampos()">Generar campos</button>

  <div id="contenedorInputs"></div>

  <div id="Botonpromedio"></div>

  <h2 id="resultado"></h2>

  <script src="calculadora.js"></script>
</body>
</html>
